name: firesafety

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    # No published ports: the database is reachable only from the server container.

  server:
    build:
      context: ..
      target: server
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend, frontend, scan]

  # Antivirus for uploaded floor plans (clamd INSTREAM on 3310, not published).
  # freshclam needs outbound access to the ClamAV mirrors, or an internal mirror
  # configured in freshclam.conf if the organisation blocks it.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    networks: [scan]

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "443:443"
    volumes:
      - ./local/certs:/certs:ro
      - caddy-data:/data
    depends_on:
      server:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]

volumes:
  db-data:
  caddy-data:
  clamav-db:

networks:
  backend:
    internal: true
  frontend:
  scan:
